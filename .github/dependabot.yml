# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Groupings (e.g. otel-* bundled into one PR) deferred until those deps exist
# to avoid empty group definitions. Revisit when observability layer lands.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(docker)"
