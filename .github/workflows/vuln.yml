name: vuln

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

# Lets `go` auto-download the toolchain required by go.mod when
# setup-go's version manifest lags behind a freshly released patch.
env:
  GOTOOLCHAIN: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Pinned to the same minor as the go.mod floor (without the patch),
          # so setup-go installs the latest 1.25.x with all stdlib fixes.
          # Bump in lockstep with the go.mod floor.
          go-version: "1.25"
          cache: true
      - run: make vuln
