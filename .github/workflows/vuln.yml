name: vuln

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Pinned to the same minor as the go.mod floor (without the patch).
          # check-latest forces a manifest re-check each run so a freshly
          # released stdlib patch is picked up without changing this yml.
          go-version: "1.25"
          check-latest: true
          cache: true
      - run: make vuln
