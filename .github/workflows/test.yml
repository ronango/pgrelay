name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify go.mod floor is 1.25
        run: |
          grep -qE '^go 1\.25' go.mod || {
            echo "::error file=go.mod::go.mod floor changed; expected 'go 1.25'"
            exit 1
          }

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make test
      - name: Build with CGO disabled (parity with Docker build)
        run: CGO_ENABLED=0 go build ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests on Postgres ${{ matrix.postgres }}
        env:
          PGRELAY_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: make test-integration
