name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify go.mod floor is 1.23
        run: |
          grep -qE '^go 1\.23' go.mod || {
            echo "::error file=go.mod::go.mod floor changed; expected 'go 1.23'"
            exit 1
          }

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make test
      - name: Build with CGO disabled (parity with Docker build)
        run: CGO_ENABLED=0 go build ./...
